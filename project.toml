# What odin-secret is and needs: build is what a program on it needs, test what only its own
# tests and checks need. house-rules docs/PROJECT_TOML.md has the layout.
[project]
schema = "amber-project-1"
name = "odin-secret"
license = "LGPL-2.1-or-later"
kind = "binding"
summary = "Odin bindings for libsecret, generated with runic"
tags = [
  "ai-assisted",
  "bindings",
  "libsecret",
  "linux",
  "odin",
  "runic",
]
collection = "secret"

[siblings.AMBER_ROOT]
odin-glib = "https://github.com/Hyperquader-Coders/odin-glib"

[build]
packages = [
  "libsecret-1-dev",
]
lib = [
  "secret",
]

[test]
packages = [
  "shellcheck",
  "shfmt",
]
